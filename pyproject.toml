[project]
name = "agent-smith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "httpx>=0.28.1",
    "docker>=7.2.0",
    "mcp[cli]>=2.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "tiktoken>=0.13.0",
    "typing>=3.10.0.0",
    "jedi>=0.20.0",
]

[tool.ruff.lint]
ignore = ["UP045"]

[tool.ruff.lint.per-file-ignores]
# refs.py is the one file we ship into the SWE-bench container, so it runs on
# the repository's own interpreter -- 3.7 for the oldest instances. `ruff
# --fix` would happily "modernise" it back to syntax that cannot even be
# parsed there: typing.List -> list (3.9), @lru_cache() -> @lru_cache (3.8).
"src/refs.py" = ["UP006", "UP033", "UP035"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]

[project.scripts]
sandbox = "agent_core.cli:main"
